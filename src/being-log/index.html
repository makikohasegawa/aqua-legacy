<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Being Log | Aqua Legacy</title>
<style>
  :root {
    --aqua-deep: #1c4e63;
    --aqua-mid: #3a7ca5;
    --aqua-light: #cfe8f0;
    --aqua-bg: #eef7fa;
    --text-main: #1f2d33;
    --text-sub: #5b6b70;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, var(--aqua-bg) 0%, #ffffff 60%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px 80px;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 1.5rem;
    margin: 0 0 8px;
    color: var(--aqua-deep);
    letter-spacing: 0.05em;
  }

  header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--text-sub);
    line-height: 1.6;
  }

  .daily-phrase {
    margin: 16px 0 0;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--aqua-mid);
  }

  .streak-status {
    margin: 10px 0 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--aqua-deep);
  }

  .memory-section {
    text-align: center;
    margin: 0 0 24px;
  }

  .memory-section button {
    padding: 10px 20px;
    font-size: 0.9rem;
    background: #ffffff;
    color: var(--aqua-deep);
    border: 1px solid var(--aqua-mid);
    border-radius: 20px;
    cursor: pointer;
  }

  .memory-section button:hover {
    background: var(--aqua-light);
  }

  .memory-result {
    margin: 12px 0 0;
    font-size: 0.9rem;
    color: var(--text-main);
    line-height: 1.6;
    min-height: 1.2em;
  }

  .entry-form {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .entry-form input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--aqua-light);
    border-radius: 8px;
    outline: none;
    background: #ffffff;
    color: var(--text-main);
  }

  .entry-form input[type="text"]:focus {
    border-color: var(--aqua-mid);
  }

  .entry-form button {
    padding: 12px 20px;
    font-size: 1rem;
    background: var(--aqua-mid);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .entry-form button:hover {
    background: var(--aqua-deep);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-sub);
    margin: 0 0 28px 2px;
    min-height: 1.2em;
  }

  @keyframes gentle-appear {
    from {
      opacity: 0;
      transform: translateY(-2px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hint.success {
    color: var(--aqua-deep);
    font-weight: 600;
    font-size: 0.85rem;
    animation: gentle-appear 0.4s ease;
  }

  .log-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .log-item {
    background: #ffffff;
    border: 1px solid var(--aqua-light);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .log-item .timestamp {
    display: block;
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-bottom: 4px;
  }

  .log-item .text {
    font-size: 1rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .empty-state {
    text-align: center;
    color: var(--text-sub);
    font-size: 0.9rem;
    padding: 40px 0;
  }

  .backup-section {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--aqua-light);
  }

  .backup-status {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin: 0 0 10px 2px;
  }

  #backup-hint {
    transition: opacity 0.6s ease;
  }

  #backup-hint.fade-out {
    opacity: 0;
  }

  .backup-actions {
    display: flex;
    gap: 8px;
    margin: 0 0 8px;
  }

  .backup-actions button {
    flex: 1;
    padding: 8px 10px;
    font-size: 0.75rem;
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--aqua-light);
    border-radius: 8px;
    cursor: pointer;
  }

  .backup-actions button:hover {
    background: var(--aqua-bg);
    color: var(--aqua-deep);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 78, 99, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .modal-overlay[hidden] {
    display: none;
  }

  .modal-box {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  }

  .modal-box p {
    margin: 0 0 20px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-main);
  }

  .modal-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .modal-buttons button {
    flex: 1;
    min-width: 100px;
    padding: 10px 12px;
    font-size: 0.85rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  #import-append-btn {
    background: var(--aqua-mid);
    color: #ffffff;
  }

  #import-append-btn:hover {
    background: var(--aqua-deep);
  }

  #import-replace-btn {
    background: #e0a94c;
    color: #ffffff;
  }

  #import-replace-btn:hover {
    background: #c98f2e;
  }

  #import-cancel-btn {
    background: #eef2f3;
    color: var(--text-main);
  }

  #import-cancel-btn:hover {
    background: #dfe6e8;
  }

  .modal-box p.modal-note {
    font-size: 0.8rem;
    color: var(--text-sub);
    margin: -8px 0 20px;
  }

  .modal-box p.modal-note:empty {
    display: none;
  }

  /* --- 目印 (DEC-0015): 眺めるときのレンズ。静かに、控えめに置く --- */

  .memory-lens-note {
    margin: 6px 0 0;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .memory-lens-note:empty {
    display: none;
  }

  .label-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
  }

  .label-bar-link {
    background: none;
    border: none;
    padding: 4px 6px;
    font-size: 0.8rem;
    color: var(--aqua-mid);
    cursor: pointer;
  }

  .label-bar-link:hover,
  .label-bar-link.active {
    color: var(--aqua-deep);
    text-decoration: underline;
  }

  .label-bar-sep {
    color: var(--aqua-light);
  }

  .label-panel {
    background: rgba(207, 232, 240, 0.25);
    border: 1px solid var(--aqua-light);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 0 0 14px;
  }

  .label-panel[hidden] {
    display: none;
  }

  .label-panel-title {
    margin: 0 0 8px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }

  .label-panel-title:not(:first-child) {
    margin-top: 16px;
  }

  .label-note {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-sub);
    line-height: 1.6;
  }

  .label-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .label-chip {
    padding: 5px 12px;
    font-size: 0.85rem;
    background: #ffffff;
    color: var(--text-main);
    border: 1px solid var(--aqua-light);
    border-radius: 16px;
    cursor: pointer;
  }

  .label-chip:hover {
    background: var(--aqua-bg);
  }

  .label-chip[aria-pressed="true"] {
    background: rgba(207, 232, 240, 0.6);
    border-color: var(--aqua-mid);
  }

  .label-manage-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .label-name-text {
    flex: 1;
    font-size: 0.9rem;
    word-break: break-word;
  }

  .label-input {
    padding: 6px 8px;
    font-size: 0.85rem;
    border: 1px solid var(--aqua-light);
    border-radius: 6px;
    background: #ffffff;
    color: var(--text-main);
  }

  .label-input-emoji {
    width: 72px;
  }

  .label-input-name {
    flex: 1;
    min-width: 120px;
  }

  .label-small-btn {
    padding: 4px 10px;
    font-size: 0.75rem;
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--aqua-light);
    border-radius: 6px;
    cursor: pointer;
  }

  .label-small-btn:hover {
    background: var(--aqua-bg);
    color: var(--aqua-deep);
  }

  .label-message {
    margin: 8px 0 0;
    font-size: 0.8rem;
    color: var(--text-sub);
  }

  .label-message:empty {
    display: none;
  }

  .lens-caption {
    margin: 0 0 12px;
    font-size: 0.8rem;
    color: var(--aqua-deep);
    text-align: center;
  }

  .lens-caption:empty {
    display: none;
  }

  .record-label-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .record-label-marks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 0.95rem;
    color: var(--text-sub);
  }

  .record-label-entrance {
    margin-left: auto;
    background: none;
    border: none;
    padding: 2px 4px;
    font-size: 0.72rem;
    color: var(--aqua-mid);
    cursor: pointer;
  }

  .record-label-entrance:hover {
    text-decoration: underline;
  }

  .record-label-panel {
    flex-basis: 100%;
    padding: 10px 12px;
    background: rgba(207, 232, 240, 0.25);
    border-radius: 8px;
  }

  .label-note-small {
    font-size: 0.72rem;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Being Log</h1>
      <p>Everything that exists has value simply by being.<br>Leave one line about a moment you noticed today.</p>
      <p class="daily-phrase" id="daily-phrase"></p>
      <p class="streak-status" id="streak-status"></p>
    </header>

    <div class="memory-section">
      <button type="button" id="memory-btn">Today's Memory</button>
      <p class="memory-result" id="memory-result"></p>
      <p class="memory-lens-note" id="memory-lens-note"></p>
    </div>

    <form class="entry-form" id="entry-form" autocomplete="off">
      <input type="text" id="entry-input" placeholder="What filled you with wonder today?" maxlength="200">
      <button type="submit">Save Today</button>
    </form>
    <p class="hint" id="hint"></p>

    <div class="label-bar">
      <button type="button" class="label-bar-link" id="label-view-link">目印で眺める</button>
      <span class="label-bar-sep">·</span>
      <button type="button" class="label-bar-link" id="label-manage-link">目印を整える</button>
    </div>
    <div class="label-panel" id="label-panel" hidden></div>
    <p class="lens-caption" id="lens-caption"></p>

    <ul class="log-list" id="log-list"></ul>

    <div class="backup-section">
      <p class="backup-status" id="backup-status"></p>
      <div class="backup-actions">
        <button type="button" id="export-btn">Back Up Memories</button>
        <button type="button" id="import-btn">Restore Memories</button>
        <input type="file" id="import-file-input" accept="application/json,.json" style="display:none">
      </div>
      <p class="hint" id="backup-hint"></p>
    </div>
  </div>

  <div class="modal-overlay" id="import-modal" hidden>
    <div class="modal-box">
      <p id="import-modal-text"></p>
      <p class="modal-note" id="import-modal-note"></p>
      <div class="modal-buttons">
        <button type="button" id="import-append-btn">Add</button>
        <button type="button" id="import-replace-btn">Replace</button>
        <button type="button" id="import-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "aqualegacy_being_log_entries";
    const LAST_BACKUP_KEY = "aqualegacy_being_log_last_backup_at";
    // DEC-0012 / DEC-0013: recordNumberは、記録がBeing Logに生まれた瞬間に一度だけ
    // 刻まれるシリアルナンバー。記録の配列とは別の、独立したカウンターとして持つ。
    const RECORD_NUMBER_COUNTER_KEY = "aqualegacy_being_log_next_record_number";

    const DAILY_PHRASES = [
      "Water does not fight. It simply flows.",
      "Everything that exists is already a miracle.",
      "Today will never come again.",
      "Someone is there. That alone is precious enough.",
      "Small moments of noticing quietly connect to the future.",
      "Being needs no reason.",
      "Today, too, you are here. That itself is a gift.",
      "Nature, people, and AI all begin simply by being.",
      "Noticing is born from remembering.",
      "A single drop eventually joins the vast sea."
    ];

    const form = document.getElementById("entry-form");
    const input = document.getElementById("entry-input");
    const hint = document.getElementById("hint");
    const list = document.getElementById("log-list");

    function loadEntries() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    // DEC-0011: 新しく作られるエントリーだけがidを持つ。既存の記録に遡ってidを振り直すことはしない。
    // このidは、将来Gardenの「希望のカケラ」(HopeFragment)が、どのBeing Logエントリーから
    // 生まれたかを指し示すために使う。Being Log自体の見た目・挙動には影響しない。
    function generateEntryId() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return "entry-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    // --- recordNumber (DEC-0012 / DEC-0013) ---

    function getNextRecordNumber() {
      const raw = localStorage.getItem(RECORD_NUMBER_COUNTER_KEY);
      const n = raw !== null ? parseInt(raw, 10) : 1;
      return Number.isFinite(n) && n >= 1 ? n : 1;
    }

    function setNextRecordNumber(n) {
      localStorage.setItem(RECORD_NUMBER_COUNTER_KEY, String(n));
    }

    function formatRecordNumber(n) {
      return "#" + String(n).padStart(6, "0");
    }

    // DEC-0012: recordNumberを持たない記録(=まだシリアルナンバーを与えられていない
    // 記録)があれば、createdAtの古い順に並べ、その時点のカウンターの値から順に
    // 付与する。初回起動時は、既存の全記録がここで#000001から番号を得る。以後は
    // すべての記録がrecordNumberを持つため、この関数は何もしない(=繰り返し呼んでも安全)。
    function migrateRecordNumbers() {
      const entries = loadEntries();
      const missing = entries.filter((e) => typeof e.recordNumber !== "number");
      if (missing.length === 0) return;

      missing.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

      let next = getNextRecordNumber();
      missing.forEach((entry) => {
        entry.recordNumber = next;
        next += 1;
      });
      setNextRecordNumber(next);
      saveEntries(entries);
    }

    // DEC-0013: バックアップ復元時のカウンターの扱い。「置き換え」は読み込んだ値を
    // そのまま採用し、「追加」は今のカウンターと読み込んだカウンターの大きい方を
    // 採用することで、番号の巻き戻り・重複を防ぐ。読み込んだファイルにカウンターが
    // 含まれていない場合(recordNumber導入前の古いバックアップ)は何もしない。その場合、
    // 取り込まれた記録はmigrateRecordNumbers()によって、今のカウンターの続きから
    // 番号を与えられる。
    function applyImportedCounter(importedNextRecordNumber, mode) {
      if (typeof importedNextRecordNumber !== "number") return;
      if (mode === "replace") {
        setNextRecordNumber(importedNextRecordNumber);
      } else {
        setNextRecordNumber(Math.max(getNextRecordNumber(), importedNextRecordNumber));
      }
    }

    function formatTimestamp(iso) {
      const d = new Date(iso);
      const monthNames = [
        "Jan", "Feb", "Mar", "Apr", "May", "Jun",
        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
      ];
      const weekdayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const month = monthNames[d.getMonth()];
      const day = d.getDate();
      const year = d.getFullYear();
      const weekday = weekdayNames[d.getDay()];
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${month} ${day}, ${year} (${weekday}) ${hh}:${mm}`;
    }

    // --- 目印 (DEC-0015 とその追補) ---
    // 目印(ラベル)の定義と、記録と目印の関係(labeling)は、記録(entries)とは別のキーに保存する。
    // この節のコードは entries を読むだけで、書き込まない。recordNumberのカウンターにも触れない。
    // 目印は、本人が後から記憶を眺めるための「レンズ」。並び順・出現頻度・見た目・重要度などを
    // 自動で変えるためには使わない。目印ごとの件数やランキングも表示しない。
    const LABELS_STORAGE_KEY = "aqualegacy_labels";
    const LABELINGS_STORAGE_KEY = "aqualegacy_memory_labelings";
    const LABEL_NAME_MAX_LENGTH = 50;
    const LABEL_EMOJI_MAX_LENGTH = 16;

    // 「最初の目印」。システムが記憶を分類するためのカテゴリーではなく、置かれているものの中から
    // 本人が気に入ったものだけを受け取れる。保存はされず、受け取った時点で本人の目印になる。
    const FIRST_LABEL_SUGGESTIONS = [
      { emoji: "😆", name: "楽しかった" },
      { emoji: "💙", name: "大切" },
      { emoji: "🌱", name: "はじまり" },
      { emoji: "😳", name: "驚いた" },
      { emoji: "😂", name: "笑った" },
      { emoji: "✨", name: "出会い" },
      { emoji: "🍀", name: "幸せ" },
      { emoji: "🌀", name: "転機" }
    ];

    const labelPanel = document.getElementById("label-panel");
    const labelViewLink = document.getElementById("label-view-link");
    const labelManageLink = document.getElementById("label-manage-link");
    const lensCaption = document.getElementById("lens-caption");
    const memoryLensNote = document.getElementById("memory-lens-note");

    let openLabelPanel = null; // null | "view" | "manage"
    let activeLabelFilterId = null; // 「目印で眺める」で選んだ目印。nullは「すべての記憶」
    let openEntranceRecordNumber = null; // 「目印」入口を開いている記録(同時に1つまで)
    let editingLabelId = null;
    let manageMessage = "";
    let manageMessageEl = null;

    function loadJsonArray(key) {
      try {
        const raw = localStorage.getItem(key);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function loadLabels() {
      return loadJsonArray(LABELS_STORAGE_KEY);
    }

    function saveLabels(labels) {
      localStorage.setItem(LABELS_STORAGE_KEY, JSON.stringify(labels));
    }

    function loadLabelings() {
      return loadJsonArray(LABELINGS_STORAGE_KEY);
    }

    function saveLabelings(labelings) {
      localStorage.setItem(LABELINGS_STORAGE_KEY, JSON.stringify(labelings));
    }

    function generateLabelRelatedId(prefix) {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return prefix + "-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    // 表示に使えない形の項目は無視するだけで、保存データからは消さない(書き込みは元の配列に対して行う)。
    function isUsableLabel(label) {
      return (
        label &&
        typeof label === "object" &&
        typeof label.id === "string" &&
        typeof label.name === "string" &&
        label.name.trim() !== ""
      );
    }

    function isUsableLabeling(labeling) {
      return (
        labeling &&
        typeof labeling === "object" &&
        Number.isInteger(labeling.beingLogRecordNumber) &&
        typeof labeling.labelId === "string"
      );
    }

    function labelDisplayText(label) {
      return label.emoji ? label.emoji + " " + label.name : label.name;
    }

    // 記録ごとの目印の一覧(目印の作成順)。参照先の目印が無い関係は、消さずに無視する。
    function buildLabelsByRecord(labels, labelings) {
      const order = new Map();
      labels.forEach((label, index) => order.set(label.id, index));
      const labelById = new Map(labels.map((label) => [label.id, label]));
      const byRecord = new Map();
      labelings.forEach((labeling) => {
        if (!isUsableLabeling(labeling) || !labelById.has(labeling.labelId)) return;
        const attached = byRecord.get(labeling.beingLogRecordNumber) || [];
        const label = labelById.get(labeling.labelId);
        if (!attached.includes(label)) attached.push(label);
        byRecord.set(labeling.beingLogRecordNumber, attached);
      });
      byRecord.forEach((attached) => attached.sort((a, b) => order.get(a.id) - order.get(b.id)));
      return byRecord;
    }

    function recordNumbersWithLabel(labelId) {
      const set = new Set();
      loadLabelings().forEach((labeling) => {
        if (isUsableLabeling(labeling) && labeling.labelId === labelId) {
          set.add(labeling.beingLogRecordNumber);
        }
      });
      return set;
    }

    function showLabelSaveError() {
      alert("目印を保存できませんでした。もう一度お試しください。");
    }

    function toggleLabeling(recordNumber, labelId) {
      const labelings = loadLabelings();
      const isSame = (labeling) =>
        isUsableLabeling(labeling) &&
        labeling.beingLogRecordNumber === recordNumber &&
        labeling.labelId === labelId;
      if (labelings.some(isSame)) {
        saveLabelings(labelings.filter((labeling) => !isSame(labeling)));
      } else {
        labelings.push({
          id: generateLabelRelatedId("labeling"),
          beingLogRecordNumber: recordNumber,
          labelId: labelId,
          attachedAt: new Date().toISOString()
        });
        saveLabelings(labelings);
      }
    }

    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    // pressed: true/false なら選択状態(aria-pressed)を持つ。nullなら通常のボタン。
    function makeChip(text, pressed, onClick) {
      const chip = makeEl("button", "label-chip", text);
      chip.type = "button";
      if (pressed !== null) chip.setAttribute("aria-pressed", pressed ? "true" : "false");
      chip.addEventListener("click", onClick);
      return chip;
    }

    function setManageMessage(message) {
      manageMessage = message;
      if (manageMessageEl) manageMessageEl.textContent = message;
    }

    function codePointLength(str) {
      return Array.from(str).length;
    }

    // 名前は必須(最大50文字程度)、絵文字は任意の短い文字列(1文字には限定しない)。
    function validateLabelInput(emojiRaw, nameRaw, exceptLabelId) {
      const emoji = emojiRaw.trim();
      const name = nameRaw.trim();
      if (name === "") return { error: "名前を入れてください。" };
      if (codePointLength(name) > LABEL_NAME_MAX_LENGTH) {
        return { error: "名前は" + LABEL_NAME_MAX_LENGTH + "文字までです。" };
      }
      if (codePointLength(emoji) > LABEL_EMOJI_MAX_LENGTH) {
        return { error: "絵文字は短めにしてください。" };
      }
      const duplicated = loadLabels().some(
        (label) =>
          isUsableLabel(label) &&
          label.id !== exceptLabelId &&
          label.name === name &&
          (label.emoji || "") === emoji
      );
      if (duplicated) return { error: "同じ目印がすでにあります。" };
      return { emoji: emoji, name: name };
    }

    function receiveSuggestedLabel(suggestion) {
      try {
        const labels = loadLabels();
        labels.push({
          id: generateLabelRelatedId("label"),
          name: suggestion.name,
          emoji: suggestion.emoji,
          createdAt: new Date().toISOString()
        });
        saveLabels(labels);
        manageMessage = "";
      } catch (e) {
        manageMessage = "保存できませんでした。もう一度お試しください。";
      }
      render();
    }

    function addLabel(emojiRaw, nameRaw) {
      const result = validateLabelInput(emojiRaw, nameRaw, null);
      if (result.error) {
        setManageMessage(result.error);
        return;
      }
      try {
        const labels = loadLabels();
        const label = {
          id: generateLabelRelatedId("label"),
          name: result.name,
          createdAt: new Date().toISOString()
        };
        if (result.emoji !== "") label.emoji = result.emoji;
        labels.push(label);
        saveLabels(labels);
        manageMessage = "";
      } catch (e) {
        manageMessage = "保存できませんでした。もう一度お試しください。";
      }
      render();
    }

    function updateLabel(labelId, emojiRaw, nameRaw) {
      const result = validateLabelInput(emojiRaw, nameRaw, labelId);
      if (result.error) {
        setManageMessage(result.error);
        return;
      }
      try {
        const labels = loadLabels();
        const target = labels.find((label) => label && label.id === labelId);
        if (target) {
          target.name = result.name;
          if (result.emoji !== "") {
            target.emoji = result.emoji;
          } else {
            delete target.emoji;
          }
          saveLabels(labels);
        }
        editingLabelId = null;
        manageMessage = "";
      } catch (e) {
        manageMessage = "保存できませんでした。もう一度お試しください。";
      }
      render();
    }

    // 目印を削除すると、その目印と、それに紐づく関係だけが消える。記録そのものは変わらない。
    function deleteLabel(label) {
      const ok = confirm(
        "「" + labelDisplayText(label) + "」の目印を削除します。\nこの目印を付けた記録は変わりません。よろしいですか？"
      );
      if (!ok) return;
      try {
        saveLabels(loadLabels().filter((item) => !(item && item.id === label.id)));
        saveLabelings(
          loadLabelings().filter((item) => !(isUsableLabeling(item) && item.labelId === label.id))
        );
        if (activeLabelFilterId === label.id) activeLabelFilterId = null;
        editingLabelId = null;
        manageMessage = "";
      } catch (e) {
        manageMessage = "削除できませんでした。もう一度お試しください。";
      }
      render();
    }

    function buildManageRow(label) {
      const row = makeEl("div", "label-manage-row");
      if (editingLabelId === label.id) {
        const emojiInput = makeEl("input", "label-input label-input-emoji");
        emojiInput.type = "text";
        emojiInput.maxLength = LABEL_EMOJI_MAX_LENGTH * 2;
        emojiInput.placeholder = "絵文字";
        emojiInput.value = label.emoji || "";
        const nameInput = makeEl("input", "label-input label-input-name");
        nameInput.type = "text";
        nameInput.maxLength = LABEL_NAME_MAX_LENGTH * 2;
        nameInput.placeholder = "名前";
        nameInput.value = label.name;
        const saveBtn = makeEl("button", "label-small-btn", "保存");
        saveBtn.type = "button";
        saveBtn.addEventListener("click", () => updateLabel(label.id, emojiInput.value, nameInput.value));
        const cancelBtn = makeEl("button", "label-small-btn", "やめる");
        cancelBtn.type = "button";
        cancelBtn.addEventListener("click", () => {
          editingLabelId = null;
          manageMessage = "";
          render();
        });
        row.appendChild(emojiInput);
        row.appendChild(nameInput);
        row.appendChild(saveBtn);
        row.appendChild(cancelBtn);
      } else {
        const name = makeEl("span", "label-name-text", labelDisplayText(label));
        const editBtn = makeEl("button", "label-small-btn", "変える");
        editBtn.type = "button";
        editBtn.addEventListener("click", () => {
          editingLabelId = label.id;
          manageMessage = "";
          render();
        });
        const deleteBtn = makeEl("button", "label-small-btn", "削除");
        deleteBtn.type = "button";
        deleteBtn.addEventListener("click", () => deleteLabel(label));
        row.appendChild(name);
        row.appendChild(editBtn);
        row.appendChild(deleteBtn);
      }
      return row;
    }

    function buildManagePanel(labels) {
      const frag = document.createDocumentFragment();

      // すでに本人の目印として受け取った(同じ名前・絵文字の)ものは、もう並べない。
      const remaining = FIRST_LABEL_SUGGESTIONS.filter(
        (s) => !labels.some((label) => label.name === s.name && (label.emoji || "") === s.emoji)
      );
      if (remaining.length > 0) {
        frag.appendChild(makeEl("p", "label-panel-title", "こんな目印もあります。気に入ったものだけ、受け取れます。"));
        const chips = makeEl("div", "label-chips");
        remaining.forEach((s) => {
          chips.appendChild(makeChip(s.emoji + " " + s.name, null, () => receiveSuggestedLabel(s)));
        });
        frag.appendChild(chips);
      }

      if (labels.length > 0) {
        frag.appendChild(makeEl("p", "label-panel-title", "あなたの目印"));
        labels.forEach((label) => frag.appendChild(buildManageRow(label)));
      }

      frag.appendChild(makeEl("p", "label-panel-title", "新しい目印をつくる"));
      const addRow = makeEl("div", "label-manage-row");
      const emojiInput = makeEl("input", "label-input label-input-emoji");
      emojiInput.type = "text";
      emojiInput.maxLength = LABEL_EMOJI_MAX_LENGTH * 2;
      emojiInput.placeholder = "絵文字";
      const nameInput = makeEl("input", "label-input label-input-name");
      nameInput.type = "text";
      nameInput.maxLength = LABEL_NAME_MAX_LENGTH * 2;
      nameInput.placeholder = "名前";
      const addBtn = makeEl("button", "label-small-btn", "追加");
      addBtn.type = "button";
      addBtn.addEventListener("click", () => addLabel(emojiInput.value, nameInput.value));
      addRow.appendChild(emojiInput);
      addRow.appendChild(nameInput);
      addRow.appendChild(addBtn);
      frag.appendChild(addRow);

      manageMessageEl = makeEl("p", "label-message", manageMessage);
      frag.appendChild(manageMessageEl);
      return frag;
    }

    function buildViewPanel(labels) {
      const frag = document.createDocumentFragment();
      if (labels.length === 0) {
        frag.appendChild(
          makeEl("p", "label-note", "まだ目印がありません。「目印を整える」から、最初の目印を受け取れます。")
        );
        return frag;
      }
      const chips = makeEl("div", "label-chips");
      chips.appendChild(
        makeChip("すべての記憶", activeLabelFilterId === null, () => {
          activeLabelFilterId = null;
          render();
        })
      );
      labels.forEach((label) => {
        chips.appendChild(
          makeChip(labelDisplayText(label), activeLabelFilterId === label.id, () => {
            activeLabelFilterId = label.id;
            render();
          })
        );
      });
      frag.appendChild(chips);
      return frag;
    }

    function renderLabelBar() {
      const labels = loadLabels().filter(isUsableLabel);
      if (activeLabelFilterId !== null && !labels.some((label) => label.id === activeLabelFilterId)) {
        activeLabelFilterId = null;
      }

      labelViewLink.classList.toggle("active", openLabelPanel === "view");
      labelManageLink.classList.toggle("active", openLabelPanel === "manage");

      labelPanel.innerHTML = "";
      manageMessageEl = null;
      if (openLabelPanel === "view") {
        labelPanel.hidden = false;
        labelPanel.appendChild(buildViewPanel(labels));
      } else if (openLabelPanel === "manage") {
        labelPanel.hidden = false;
        labelPanel.appendChild(buildManagePanel(labels));
      } else {
        labelPanel.hidden = true;
      }

      const active =
        activeLabelFilterId !== null ? labels.find((label) => label.id === activeLabelFilterId) : null;
      lensCaption.textContent = active ? labelDisplayText(active) + " の記憶を眺めています。" : "";
      memoryLensNote.textContent = active ? labelDisplayText(active) + " の記憶から選びます。" : "";
    }

    labelViewLink.addEventListener("click", () => {
      openLabelPanel = openLabelPanel === "view" ? null : "view";
      editingLabelId = null;
      manageMessage = "";
      render();
    });

    labelManageLink.addEventListener("click", () => {
      openLabelPanel = openLabelPanel === "manage" ? null : "manage";
      editingLabelId = null;
      manageMessage = "";
      render();
    });

    // 各記録の下に置く、静かな「目印」の入口。押したときだけ、自分の目印が並ぶ。
    function buildRecordLabelRow(recordNumber, labels, labelsByRecord) {
      const row = makeEl("div", "record-label-row");
      const attached = labelsByRecord.get(recordNumber) || [];

      const marks = makeEl("span", "record-label-marks");
      attached.forEach((label) => {
        const mark = makeEl("span", "record-label-mark", label.emoji ? label.emoji : label.name);
        mark.title = labelDisplayText(label);
        marks.appendChild(mark);
      });
      row.appendChild(marks);

      const entrance = makeEl("button", "record-label-entrance", "目印");
      entrance.type = "button";
      entrance.setAttribute("aria-expanded", openEntranceRecordNumber === recordNumber ? "true" : "false");
      entrance.addEventListener("click", () => {
        openEntranceRecordNumber = openEntranceRecordNumber === recordNumber ? null : recordNumber;
        render();
      });
      row.appendChild(entrance);

      if (openEntranceRecordNumber === recordNumber) {
        const panel = makeEl("div", "record-label-panel");
        if (labels.length === 0) {
          panel.appendChild(
            makeEl("p", "label-note", "まだ目印がありません。「目印を整える」から、最初の目印を受け取れます。")
          );
        } else {
          const attachedIds = new Set(attached.map((label) => label.id));
          // 初めて触る人にも操作が分かるように、色の違いだけでなく「✓」と短い説明で示す。
          panel.appendChild(
            makeEl(
              "p",
              "label-note label-note-small",
              "押すと、この記憶への付け外しができます。目印そのものは消えません。"
            )
          );
          const chips = makeEl("div", "label-chips");
          labels.forEach((label) => {
            const isAttached = attachedIds.has(label.id);
            const chipText = (isAttached ? "✓ " : "") + labelDisplayText(label);
            chips.appendChild(
              makeChip(chipText, isAttached, () => {
                try {
                  toggleLabeling(recordNumber, label.id);
                } catch (e) {
                  showLabelSaveError();
                }
                render();
              })
            );
          });
          panel.appendChild(chips);
        }
        row.appendChild(panel);
      }
      return row;
    }

    function render() {
      const entries = loadEntries();
      list.innerHTML = "";
      updateBackupStatus();
      updateStreakStatus();
      renderLabelBar();

      if (entries.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "No memories yet.";
        list.appendChild(empty);
        return;
      }

      const labels = loadLabels().filter(isUsableLabel);
      const labelsByRecord = buildLabelsByRecord(labels, loadLabelings());
      const lensRecordNumbers =
        activeLabelFilterId !== null ? recordNumbersWithLabel(activeLabelFilterId) : null;
      const visibleEntries = lensRecordNumbers
        ? entries.filter((e) => lensRecordNumbers.has(e.recordNumber))
        : entries;

      if (visibleEntries.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "この目印の付いた記憶は、まだありません。";
        list.appendChild(empty);
        return;
      }

      visibleEntries
        .slice()
        .reverse()
        .forEach((entry) => {
          const li = document.createElement("li");
          li.className = "log-item";

          const ts = document.createElement("span");
          ts.className = "timestamp";
          const recordNumberText =
            typeof entry.recordNumber === "number" ? formatRecordNumber(entry.recordNumber) + " · " : "";
          ts.textContent = recordNumberText + formatTimestamp(entry.createdAt);

          const text = document.createElement("div");
          text.className = "text";
          text.textContent = entry.text;

          li.appendChild(ts);
          li.appendChild(text);
          if (typeof entry.recordNumber === "number") {
            li.appendChild(buildRecordLabelRow(entry.recordNumber, labels, labelsByRecord));
          }
          list.appendChild(li);
        });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();

      if (value === "") {
        hint.classList.remove("success");
        hint.textContent = "Please write a line before saving.";
        return;
      }

      const entries = loadEntries();
      const nextNumber = getNextRecordNumber();
      entries.push({
        id: generateEntryId(),
        recordNumber: nextNumber,
        text: value,
        createdAt: new Date().toISOString()
      });
      setNextRecordNumber(nextNumber + 1);
      saveEntries(entries);

      input.value = "";
      hint.classList.add("success");
      hint.textContent = "Today's moment has been saved.";
      render();
      input.focus();
    });

    input.addEventListener("input", () => {
      if (hint.textContent) {
        hint.textContent = "";
        hint.classList.remove("success");
      }
    });

    function showDailyPhrase() {
      const phrase = DAILY_PHRASES[Math.floor(Math.random() * DAILY_PHRASES.length)];
      document.getElementById("daily-phrase").textContent = phrase;
    }

    // --- Streak (consecutive days) ---

    function toLocalDateKey(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function calculateStreak(entries) {
      const dateKeys = new Set(entries.map((e) => toLocalDateKey(new Date(e.createdAt))));

      let cursor = new Date();
      if (!dateKeys.has(toLocalDateKey(cursor))) {
        const yesterday = new Date(cursor);
        yesterday.setDate(yesterday.getDate() - 1);
        if (dateKeys.has(toLocalDateKey(yesterday))) {
          cursor = yesterday;
        } else {
          return 0;
        }
      }

      let streak = 0;
      while (dateKeys.has(toLocalDateKey(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function updateStreakStatus() {
      const streak = calculateStreak(loadEntries());
      const el = document.getElementById("streak-status");
      el.textContent =
        streak > 0 ? `${streak}-day streak.` : "Start your first entry today.";
    }

    // --- Today's Memory (random past entry, excluding today's) ---

    const memoryBtn = document.getElementById("memory-btn");
    const memoryResult = document.getElementById("memory-result");

    memoryBtn.addEventListener("click", () => {
      const todayKey = toLocalDateKey(new Date());
      let candidates = loadEntries().filter(
        (e) => toLocalDateKey(new Date(e.createdAt)) !== todayKey
      );

      // 「目印で眺める」で本人が目印を選んでいるときだけ、その目印の記憶から選ぶ(重みなしの一様ランダム)。
      if (activeLabelFilterId !== null) {
        const lensRecordNumbers = recordNumbersWithLabel(activeLabelFilterId);
        candidates = candidates.filter((e) => lensRecordNumbers.has(e.recordNumber));
      }

      if (candidates.length === 0) {
        memoryResult.textContent =
          activeLabelFilterId !== null
            ? "この目印の付いた過去の記憶は、まだありません。"
            : "No past memories to recall yet.";
        return;
      }

      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      memoryResult.textContent = `${formatTimestamp(pick.createdAt)}: ${pick.text}`;
    });

    // --- Back Up / Restore Memories ---

    const exportBtn = document.getElementById("export-btn");
    const importBtn = document.getElementById("import-btn");
    const importFileInput = document.getElementById("import-file-input");
    const backupHint = document.getElementById("backup-hint");
    const importModal = document.getElementById("import-modal");
    const importModalText = document.getElementById("import-modal-text");
    const importModalNote = document.getElementById("import-modal-note");
    const importAppendBtn = document.getElementById("import-append-btn");
    const importReplaceBtn = document.getElementById("import-replace-btn");
    const importCancelBtn = document.getElementById("import-cancel-btn");

    let pendingImportEntries = null;
    let pendingImportNextRecordNumber = null;
    // バックアップ version 3 のときだけ、目印の定義と関係を持つ(version 2 では null)。
    let pendingImportLabels = null;
    let pendingImportLabelings = null;
    let backupHintTimer = null;

    function setBackupHint(message) {
      clearTimeout(backupHintTimer);
      backupHint.classList.remove("fade-out");
      backupHint.textContent = message;
    }

    function getLastBackupAt() {
      return localStorage.getItem(LAST_BACKUP_KEY);
    }

    function setLastBackupAt(iso) {
      localStorage.setItem(LAST_BACKUP_KEY, iso);
    }

    function updateBackupStatus() {
      const count = loadEntries().length;
      const lastBackup = getLastBackupAt();
      const backupText = lastBackup ? formatTimestamp(lastBackup) : "Not yet";
      document.getElementById("backup-status").textContent =
        `Entries: ${count} / Last backup: ${backupText}`;
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function getDateStringForFilename(d) {
      const target = d || new Date();
      return `${target.getFullYear()}-${pad2(target.getMonth() + 1)}-${pad2(target.getDate())}`;
    }

    function downloadJSON(filename, dataObj) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    exportBtn.addEventListener("click", () => {
      const entries = loadEntries();

      if (entries.length === 0) {
        alert("There are no entries yet. No backup will be created.");
        setBackupHint("No backup was created because there are no entries.");
        return;
      }

      try {
        const labels = loadLabels();
        const labelings = loadLabelings();
        const payload = {
          // version 3 (DEC-0015の追補): version 2 の項目はそのままに、目印の定義と関係を加える。
          version: 3,
          exportedAt: new Date().toISOString(),
          entries: entries,
          // DEC-0013: recordNumberの発行元であるカウンターも、記録本体と一緒に
          // 書き出す。これにより、別端末への復元後も番号の巻き戻り・重複を防げる。
          nextRecordNumber: getNextRecordNumber(),
          labels: labels,
          labelings: labelings
        };
        const filename = `being-log-${getDateStringForFilename()}.json`;
        downloadJSON(filename, payload);
        setLastBackupAt(payload.exportedAt);
        updateBackupStatus();
        const hasLabelData = labels.length > 0 || labelings.length > 0;
        setBackupHint(
          `Saved as ${filename}.` +
            (hasLabelData ? " 目印を引き継ぐには、最新のBeing Logで復元してください。" : "")
        );
        backupHintTimer = setTimeout(() => {
          backupHint.classList.add("fade-out");
        }, hasLabelData ? 7000 : 3000);
      } catch (e) {
        setBackupHint("Backup failed. Please try again.");
      }
    });

    function isValidEntry(entry) {
      return (
        entry &&
        typeof entry === "object" &&
        typeof entry.text === "string" &&
        entry.text.trim() !== "" &&
        typeof entry.createdAt === "string" &&
        !isNaN(Date.parse(entry.createdAt))
      );
    }

    function validateImportPayload(payload) {
      if (!payload || typeof payload !== "object") return false;
      if (typeof payload.version !== "number") return false;
      if (!Array.isArray(payload.entries)) return false;
      return payload.entries.every(isValidEntry);
    }

    // --- 目印の検証 (バックアップ version 3 / DEC-0015の追補) ---

    function isValidLabelRecord(label) {
      return (
        label &&
        typeof label === "object" &&
        typeof label.id === "string" &&
        label.id !== "" &&
        typeof label.name === "string" &&
        label.name.trim() !== "" &&
        (label.emoji === undefined || typeof label.emoji === "string") &&
        typeof label.createdAt === "string" &&
        !isNaN(Date.parse(label.createdAt))
      );
    }

    function isValidLabelingRecord(labeling) {
      return (
        labeling &&
        typeof labeling === "object" &&
        typeof labeling.id === "string" &&
        labeling.id !== "" &&
        Number.isInteger(labeling.beingLogRecordNumber) &&
        labeling.beingLogRecordNumber >= 1 &&
        typeof labeling.labelId === "string" &&
        labeling.labelId !== "" &&
        typeof labeling.attachedAt === "string" &&
        !isNaN(Date.parse(labeling.attachedAt))
      );
    }

    // version 3 以上のファイルだけが、目印の情報(labels / labelings)を持つ。
    function hasLabelDataVersion(payload) {
      return payload.version >= 3;
    }

    function validateLabelData(payload) {
      if (!hasLabelDataVersion(payload)) return true;
      return (
        Array.isArray(payload.labels) &&
        Array.isArray(payload.labelings) &&
        payload.labels.every(isValidLabelRecord) &&
        payload.labelings.every(isValidLabelingRecord)
      );
    }

    importBtn.addEventListener("click", () => {
      importFileInput.value = "";
      importFileInput.click();
    });

    importFileInput.addEventListener("change", () => {
      const file = importFileInput.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {
        let payload;
        try {
          payload = JSON.parse(reader.result);
        } catch (e) {
          setBackupHint("The selected file is not valid JSON. Import cancelled.");
          importFileInput.value = "";
          return;
        }

        if (!validateImportPayload(payload)) {
          setBackupHint("The selected file is not a Being Log backup. Import cancelled.");
          importFileInput.value = "";
          return;
        }

        if (!validateLabelData(payload)) {
          setBackupHint("目印の情報が正しくありません。取り込みを中止しました。");
          importFileInput.value = "";
          return;
        }

        pendingImportEntries = payload.entries;
        pendingImportNextRecordNumber =
          typeof payload.nextRecordNumber === "number" ? payload.nextRecordNumber : null;
        const hasLabelData = hasLabelDataVersion(payload);
        pendingImportLabels = hasLabelData ? payload.labels : null;
        pendingImportLabelings = hasLabelData ? payload.labelings : null;
        const exportedAtText = payload.exportedAt ? formatTimestamp(payload.exportedAt) : "unknown";
        importModalText.textContent =
          `"${file.name}" contains ${payload.entries.length} entries (backed up: ${exportedAtText}). ` +
          `Add them to your existing entries, or replace them?`;
        // 目印についての案内(確認のための合計数のみ。目印ごとの数は出さない)。
        importModalNote.textContent = hasLabelData
          ? `目印${payload.labels.length}個・関係${payload.labelings.length}件が含まれています。` +
            "「Replace」では記録と目印がまとめて置き換わります。" +
            "「Add」では記録だけが追加され、目印は取り込まれません。"
          : "このバックアップには目印の情報がありません。「Replace」でも、今ある目印はそのまま残ります。";
        importModal.hidden = false;
      };

      reader.onerror = () => {
        setBackupHint("An error occurred while reading the file. Your existing entries were not changed.");
        importFileInput.value = "";
      };

      reader.readAsText(file);
    });

    function closeImportModal() {
      importModal.hidden = true;
      pendingImportEntries = null;
      pendingImportNextRecordNumber = null;
      pendingImportLabels = null;
      pendingImportLabelings = null;
      importModalNote.textContent = "";
      importFileInput.value = "";
    }

    importCancelBtn.addEventListener("click", () => {
      closeImportModal();
    });

    importAppendBtn.addEventListener("click", () => {
      if (!pendingImportEntries) return;
      const count = pendingImportEntries.length;
      try {
        const current = loadEntries();
        const merged = current.concat(pendingImportEntries);
        saveEntries(merged);
        // DEC-0013: 追加(マージ)時は、今のカウンターと読み込んだカウンターの
        // 大きい方を採用してから、番号を持たない記録があれば付与する。
        applyImportedCounter(pendingImportNextRecordNumber, "append");
        migrateRecordNumbers();
        render();
        // 今回の最小実装では、Addで目印は取り込まない(将来の検討課題。DEC-0015の追補)。
        const skippedLabels =
          pendingImportLabels !== null &&
          (pendingImportLabels.length > 0 || pendingImportLabelings.length > 0);
        setBackupHint(
          `${count} entries restored (added to existing).` +
            (skippedLabels ? " 目印は今回は取り込まれていません。" : "")
        );
      } catch (e) {
        setBackupHint("Restore failed. Your existing entries were not changed.");
      }
      closeImportModal();
    });

    importReplaceBtn.addEventListener("click", () => {
      if (!pendingImportEntries) return;
      const count = pendingImportEntries.length;
      // version 3 のファイルでは、記録と一緒に目印の定義・関係も置き換える。
      // version 2 のファイル(目印の情報なし)では、今ある目印はそのまま残す。
      const replacesLabels = pendingImportLabels !== null;
      const previousLabels = replacesLabels ? loadLabels() : null;
      const previousLabelings = replacesLabels ? loadLabelings() : null;
      try {
        // 目印を先に書き、記録は最後に書く。途中で失敗しても、記録(entries)が先に
        // 書き換わることはなく、目印も元に戻せる。
        if (replacesLabels) {
          saveLabels(pendingImportLabels);
          saveLabelings(pendingImportLabelings);
        }
        saveEntries(pendingImportEntries);
        // DEC-0013: 置き換え時は、読み込んだカウンターをそのまま採用してから、
        // 番号を持たない記録があれば付与する。
        applyImportedCounter(pendingImportNextRecordNumber, "replace");
        migrateRecordNumbers();
        editingLabelId = null;
        render();
        setBackupHint(
          `${count} entries restored (existing entries replaced).` + (replacesLabels ? " 目印も復元しました。" : "")
        );
      } catch (e) {
        if (replacesLabels) {
          try {
            saveLabels(previousLabels);
            saveLabelings(previousLabelings);
          } catch (rollbackError) {
            // 元に戻せなかった場合も、記録そのものは書き換わっていない。
          }
        }
        setBackupHint("Restore failed. Your existing entries were not changed.");
      }
      closeImportModal();
    });

    // DEC-0012: 新しい記録を1件でも作る前に、recordNumberの初回移行を必ず終わらせる。
    migrateRecordNumbers();
    showDailyPhrase();
    render();
  </script>
</body>
</html>
